services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: immoprix:latest          # image construite une fois...
    ports:
      - "8000:8000"
    command: sh -c "uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

  streamlit:
    image: immoprix:latest          # ...reutilisee ici (pas de 2e build)
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      # Dans un reseau compose, on appelle l'autre service par son NOM, pas localhost.
      - API_URL=http://api:8000
    command: sh -c "uv run streamlit run src/api/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"