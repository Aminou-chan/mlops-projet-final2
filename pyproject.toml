[project]
name = "projet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.136.3",
    "great-expectations>=1.18.1",
    "matplotlib>=3.11.0",
    "mlflow>=3.13.0",
    "numba>=0.61",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "shap>=0.49.1",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.3",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]


[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "src/api/streamlit_app.py",
    "src/data/save_raw_data.py",
]